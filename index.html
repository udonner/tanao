<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>棚卸スキャンアプリ</title>

    <!-- インターネット接続が必要です -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f3f4f6;
            color: #1f2937;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: .6; }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: #2563eb;
            color: white;
            box-shadow: 0 2px 8px #0002;
        }

        .header h1 { margin: 0; font-size: 1.2rem; }
        .container {
            width: min(100% - 24px, 520px);
            margin: 16px auto 40px;
        }

        .card {
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            background: white;
            box-shadow: 0 1px 3px #0000000a;
        }

        .section-title { margin: 0 0 12px; font-size: 1rem; }
        .area-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .muted { color: #6b7280; font-size: .85rem; }
        #currentArea { margin: 4px 0 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
        #areaIndicator { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; background: #ef4444; }
        #areaIndicator.active { background: #22c55e; }

        #reader {
            width: 100%;
            min-height: 180px;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #111827;
        }

        /* html5-qrcode が作る映像サイズを無理に固定しない */
        #reader video {
            display: block;
            max-width: 100% !important;
            object-fit: contain !important;
        }

        #reader img { max-width: 100%; }
        #reader__scan_region { min-height: 140px; }
        #reader__dashboard { padding: 8px; }

        .button {
            display: block;
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
        }

        .primary { background: #2563eb; color: white; }
        .secondary { background: #f3f4f6; color: #374151; }
        .danger { background: #fee2e2; color: #b91c1c; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        #cameraStatus { margin: 10px 0 0; overflow-wrap: anywhere; }
        #historyList { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            background: #f9fafb;
            font-size: .85rem;
        }
        .history-main { min-width: 0; overflow-wrap: anywhere; }
        .history-title { font-weight: 700; }
        .history-meta { margin-top: 4px; color: #6b7280; font-size: .75rem; }
        .history-qty { white-space: nowrap; font-size: 1rem; font-weight: 800; }
        .delete-button {
            border: 0;
            border-radius: 8px;
            padding: 6px 8px;
            background: #fee2e2;
            color: #b91c1c;
        }

        .hidden { display: none !important; }
        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #0009;
        }
        .modal-panel {
            width: min(100%, 360px);
            padding: 24px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 12px 40px #0004;
        }
        .modal-panel h3 { margin: 4px 0 16px; overflow-wrap: anywhere; }
        .modal-panel label { display: block; margin-bottom: 6px; color: #6b7280; font-size: .85rem; }
        #quantityInput {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }
        #toast {
            position: fixed;
            z-index: 120;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100% - 32px);
            padding: 12px 16px;
            border-radius: 999px;
            background: #111827;
            color: white;
            font-size: .85rem;
            box-shadow: 0 4px 16px #0003;
        }
        @media (max-width: 360px) {
            .header h1 { font-size: 1rem; }
            .card { padding: 12px; }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>📦 棚卸スキャン</h1>
        <span>Web App</span>
    </header>

    <main class="container">
        <section class="card">
            <div class="area-row">
                <div>
                    <div class="muted">現在の棚卸エリア</div>
                    <p id="currentArea">⚠️ 未選択 (AR-...)</p>
                </div>
                <div id="areaIndicator" aria-label="エリア未選択"></div>
            </div>
        </section>

        <section class="card">
            <h2 class="section-title">📷 バーコードリーダー</h2>
            <div id="reader"></div>
            <button id="startCameraBtn" class="button primary" type="button">📷 カメラを起動</button>
            <button id="stopCameraBtn" class="button secondary hidden" type="button" style="margin-top:8px">カメラを停止</button>
            <p id="cameraStatus" class="muted" role="status" aria-live="polite">
                ボタンを押してカメラを起動してください。
            </p>
            <p class="muted">エリアバーコード (AR-) または品物バーコード (ITEM-) を読み取ってください。</p>
        </section>

        <section class="card">
            <div class="area-row" style="margin-bottom:12px">
                <h2 class="section-title" style="margin:0">📊 スキャン履歴 (<span id="dataCount">0</span>件)</h2>
                <button id="downloadCsv" class="secondary hidden" type="button" style="padding:8px;border:0;border-radius:8px">CSV出力</button>
            </div>
            <div id="historyList">
                <p id="emptyMessage" class="muted" style="text-align:center;padding:24px 0">データがありません。バーコードをスキャンしてください。</p>
            </div>
        </section>
    </main>

    <div id="quantityModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalItemTitle">
        <div class="modal-panel">
            <div class="muted" style="color:#16a34a;font-weight:700">品物を検知しました</div>
            <h3 id="modalItemTitle">ITEM-001</h3>
            <label for="quantityInput">数量を入力してください</label>
            <input type="number" id="quantityInput" min="1" step="1" value="1" inputmode="numeric">
            <div class="button-row" style="margin-top:16px">
                <button id="cancelModalBtn" class="button secondary" type="button">キャンセル</button>
                <button id="submitModalBtn" class="button primary" type="button">確定して再開</button>
            </div>
        </div>
    </div>

    <div id="toast" class="hidden" role="status" aria-live="polite"></div>

    <script>
    (() => {
        'use strict';

        // --- 状態 ---
        let currentAreaId = '';
        let inventoryData = [];
        let html5QrcodeScanner = null;
        let isProcessing = false;
        let cameraStarting = false;
        let cameraRunning = false;
        let pendingItemId = '';
        let toastTimer = null;

        // --- DOM ---
        const currentAreaEl = document.getElementById('currentArea');
        const areaIndicatorEl = document.getElementById('areaIndicator');
        const quantityModalEl = document.getElementById('quantityModal');
        const modalItemTitleEl = document.getElementById('modalItemTitle');
        const quantityInputEl = document.getElementById('quantityInput');
        const submitModalBtn = document.getElementById('submitModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const historyListEl = document.getElementById('historyList');
        const emptyMessageEl = document.getElementById('emptyMessage');
        const dataCountEl = document.getElementById('dataCount');
        const downloadCsvBtn = document.getElementById('downloadCsv');
        const toastEl = document.getElementById('toast');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const cameraStatusEl = document.getElementById('cameraStatus');

        // --- localStorageを安全に読み込む ---
        function loadStoredData(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw === null ? fallback : JSON.parse(raw);
            } catch (error) {
                console.error(`保存データ読み込みエラー (${key}):`, error);
                return fallback;
            }
        }

        try {
            currentAreaId = localStorage.getItem('inventory_current_area') || '';
        } catch (error) {
            console.warn('エリア保存領域を利用できません:', error);
        }

        const storedInventory = loadStoredData('inventory_records', []);
        inventoryData = Array.isArray(storedInventory) ? storedInventory : [];

        function saveLocalData(key, value) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (error) {
                console.error(`保存エラー (${key}):`, error);
                showToast('端末にデータを保存できませんでした。ブラウザ設定を確認してください。');
                return false;
            }
        }

        // --- 初期化 ---
        document.addEventListener('DOMContentLoaded', () => {
            updateAreaUI();
            renderHistory();

            startCameraBtn.addEventListener('click', initScanner);
            stopCameraBtn.addEventListener('click', stopScanner);
            submitModalBtn.addEventListener('click', submitQuantity);
            cancelModalBtn.addEventListener('click', closeModal);
            downloadCsvBtn.addEventListener('click', exportToCsv);

            quantityInputEl.addEventListener('keydown', event => {
                if (event.key === 'Enter') submitQuantity();
            });
        });

        // --- 通知 ---
        function showToast(message, duration = 2500) {
            toastEl.textContent = message;
            toastEl.classList.remove('hidden');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.add('hidden'), duration);
        }

        // --- エリア表示 ---
        function updateAreaUI() {
            if (currentAreaId) {
                currentAreaEl.textContent = currentAreaId;
                currentAreaEl.style.color = '#2563eb';
                areaIndicatorEl.classList.add('active');
                areaIndicatorEl.setAttribute('aria-label', 'エリア選択済み');
            } else {
                currentAreaEl.textContent = '⚠️ 未選択 (AR-...)';
                currentAreaEl.style.color = '#dc2626';
                areaIndicatorEl.classList.remove('active');
                areaIndicatorEl.setAttribute('aria-label', 'エリア未選択');
            }
        }

        // --- カメラ起動 ---
        async function initScanner() {
            if (cameraStarting || cameraRunning) return;

            cameraStarting = true;
            startCameraBtn.disabled = true;
            cameraStatusEl.textContent = 'カメラを起動しています…';

            try {
                if (!window.isSecureContext) {
                    throw new Error(
                        '安全な接続ではないためカメラを利用できません。HTTPSのURLで開いてください。'
                    );
                }

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error(
                        'このブラウザではカメラ機能を利用できません。最新のChromeまたはSafariで開いてください。'
                    );
                }

                if (typeof window.Html5Qrcode === 'undefined') {
                    throw new Error(
                        'QR読み取りライブラリを読み込めませんでした。インターネット接続を確認して再読み込みしてください。'
                    );
                }

                if (!html5QrcodeScanner) {
                    html5QrcodeScanner = new Html5Qrcode('reader');
                }

                const config = {
                    fps: 10,
                    qrbox: (width, height) => {
                        const boxWidth = Math.max(100, Math.floor(Math.min(width, height) * 0.7));
                        return {
                            width: Math.min(boxWidth, width),
                            height: Math.min(Math.floor(boxWidth * 0.55), height)
                        };
                    },
                    aspectRatio: 1.333
                };

                // カメラ一覧を取得できる場合は背面カメラを優先して選択する
                let cameraId = null;
                try {
                    const cameras = await Html5Qrcode.getCameras();
                    if (cameras && cameras.length) {
                        const backCamera = cameras.find(camera =>
                            /back|rear|environment|背面|後ろ/i.test(camera.label || '')
                        );
                        cameraId = (backCamera || cameras[0]).id;
                    }
                } catch (cameraListError) {
                    console.warn('カメラ一覧を取得できません。背面カメラ指定で試します:', cameraListError);
                }

                if (cameraId) {
                    await html5QrcodeScanner.start(cameraId, config, onScanSuccess, onScanFailure);
                } else {
                    await html5QrcodeScanner.start(
                        { facingMode: { ideal: 'environment' } },
                        config,
                        onScanSuccess,
                        onScanFailure
                    );
                }

                cameraRunning = true;
                cameraStatusEl.textContent = 'カメラ起動中です。バーコードをかざしてください。';
                startCameraBtn.classList.add('hidden');
                stopCameraBtn.classList.remove('hidden');
            } catch (error) {
                console.error('カメラ起動エラー:', error);

                let message = error && error.message ? error.message : String(error);
                if (error && error.name === 'NotAllowedError') {
                    message = 'カメラへのアクセスが拒否されました。ブラウザのサイト設定でカメラを許可してください。';
                } else if (error && error.name === 'NotFoundError') {
                    message = '利用できるカメラが見つかりません。';
                } else if (error && error.name === 'NotReadableError') {
                    message = 'カメラを他のアプリが使用中か、カメラを起動できません。ほかのカメラアプリを閉じてください。';
                } else if (error && error.name === 'OverconstrainedError') {
                    message = '指定したカメラ条件に対応できません。別のカメラを選択してください。';
                }

                cameraStatusEl.textContent = `起動失敗：${message}`;
                startCameraBtn.textContent = 'もう一度試す';
                startCameraBtn.classList.remove('hidden');
                stopCameraBtn.classList.add('hidden');
                startCameraBtn.disabled = false;

                // 起動に失敗したオブジェクトは状態が不明な場合があるため再生成
                try {
                    if (html5QrcodeScanner) {
                        await html5QrcodeScanner.clear();
                    }
                } catch (clearError) {
                    console.warn('スキャナーの後処理:', clearError);
                }
                html5QrcodeScanner = null;
            } finally {
                cameraStarting = false;
            }
        }

        function onScanFailure(_errorMessage) {
            // 読み取り失敗は毎フレーム発生するため、画面には表示しない
        }

        // --- カメラ停止 ---
        async function stopScanner() {
            if (!html5QrcodeScanner || !cameraRunning) return;

            stopCameraBtn.disabled = true;
            cameraStatusEl.textContent = 'カメラを停止しています…';

            try {
                await html5QrcodeScanner.stop();
                await html5QrcodeScanner.clear();
                cameraRunning = false;
                isProcessing = false;
                html5QrcodeScanner = null;
                cameraStatusEl.textContent = 'カメラを停止しました。再開するにはボタンを押してください。';
                startCameraBtn.textContent = '📷 カメラを起動';
                startCameraBtn.classList.remove('hidden');
                stopCameraBtn.classList.add('hidden');
            } catch (error) {
                console.error('カメラ停止エラー:', error);
                cameraStatusEl.textContent = `停止時のエラー：${error.message || error}`;
            } finally {
                stopCameraBtn.disabled = false;
            }
        }

        // --- スキャン成功 ---
        function onScanSuccess(decodedText) {
            if (isProcessing) return;

            if (decodedText.startsWith('AR-')) {
                isProcessing = true;
                currentAreaId = decodedText;
                saveLocalData('inventory_current_area', currentAreaId);
                updateAreaUI();
                showToast(`エリアを「${decodedText}」に変更しました`);
                setTimeout(() => { isProcessing = false; }, 1500);
                return;
            }

            if (decodedText.startsWith('ITEM-')) {
                if (!currentAreaId) {
                    isProcessing = true;
                    showToast('先にエリアバーコード（AR-...）をスキャンしてください');
                    setTimeout(() => { isProcessing = false; }, 1500);
                    return;
                }

                isProcessing = true;
                pendingItemId = decodedText;
                modalItemTitleEl.textContent = decodedText;
                quantityInputEl.value = '1';
                quantityModalEl.classList.remove('hidden');

                setTimeout(() => {
                    quantityInputEl.focus();
                    quantityInputEl.select();
                }, 100);
                return;
            }

            console.log('対象外のコード:', decodedText);
        }

        // --- 数量確定 ---
        function submitQuantity() {
            const qty = Number.parseInt(quantityInputEl.value, 10);

            if (!Number.isInteger(qty) || qty <= 0) {
                alert('1以上の正しい個数を入力してください。');
                return;
            }

            if (!pendingItemId) {
                closeModal();
                return;
            }

            const record = {
                id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
                datetime: new Date().toLocaleString('ja-JP'),
                area: currentAreaId,
                item: pendingItemId,
                quantity: qty
            };

            inventoryData.unshift(record);
            saveLocalData('inventory_records', JSON.stringify(inventoryData));
            showToast(`${pendingItemId} を ${qty} 個記録しました`);
            renderHistory();
            closeModal();
        }

        // --- 数量入力を閉じる ---
        function closeModal() {
            quantityModalEl.classList.add('hidden');
            pendingItemId = '';
            setTimeout(() => { isProcessing = false; }, 800);
        }

        // --- 履歴描画 ---
        function renderHistory() {
            dataCountEl.textContent = inventoryData.length;
            historyListEl.querySelectorAll('.history-item').forEach(element => element.remove());

            if (inventoryData.length === 0) {
                emptyMessageEl.classList.remove('hidden');
                downloadCsvBtn.classList.add('hidden');
                return;
            }

            emptyMessageEl.classList.add('hidden');
            downloadCsvBtn.classList.remove('hidden');

            inventoryData.forEach(data => {
                const row = document.createElement('div');
                row.className = 'history-item';

                const main = document.createElement('div');
                main.className = 'history-main';

                const title = document.createElement('div');
                title.className = 'history-title';
                title.textContent = data.item || '';

                const area = document.createElement('div');
                area.textContent = `エリア：${data.area || ''}`;

                const date = document.createElement('div');
                date.className = 'history-meta';
                date.textContent = data.datetime || '';

                main.append(title, area, date);

                const right = document.createElement('div');
                right.style.display = 'flex';
                right.style.alignItems = 'center';
                right.style.gap = '8px';

                const qty = document.createElement('span');
                qty.className = 'history-qty';
                qty.textContent = `${data.quantity} 個`;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-button';
                deleteBtn.type = 'button';
                deleteBtn.textContent = '削除';
                deleteBtn.setAttribute('aria-label', `${data.item} の記録を削除`);
                deleteBtn.addEventListener('click', () => deleteRecord(data.id));

                right.append(qty, deleteBtn);
                row.append(main, right);
                historyListEl.appendChild(row);
            });
        }

        // --- 履歴削除 ---
        function deleteRecord(id) {
            if (!confirm('この記録を削除してもよろしいですか？')) return;

            inventoryData = inventoryData.filter(item => item.id !== id);
            saveLocalData('inventory_records', JSON.stringify(inventoryData));
            showToast('データを削除しました');
            renderHistory();
        }

        // --- CSV出力 ---
        function exportToCsv() {
            if (!inventoryData.length) return;

            const escapeCsv = value =>
                `"${String(value ?? '').replace(/"/g, '""')}"`;

            const rows = [
                ['日時', 'エリアID', '品物ID', '個数'],
                ...inventoryData.map(row => [
                    row.datetime,
                    row.area,
                    row.item,
                    row.quantity
                ])
            ];

            // Excelで日本語が文字化けしにくいようBOMを付ける
            const csvContent = '\uFEFF' + rows
                .map(row => row.map(escapeCsv).join(','))
                .join('\r\n');

            const blob = new Blob([csvContent], {
                type: 'text/csv;charset=utf-8;'
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);

            link.href = url;
            link.download = `棚卸データ_${dateStr}.csv`;
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

    })();
    </script>
</body>
</html>
