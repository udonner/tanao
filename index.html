<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棚卸スキャンアプリ</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- html5-qrcode library for barcode scanning -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* カメラ映像のミラー反転を防止、およびレスポンシブ対応 */
        #reader video {
            transform: none !important;
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            📦 棚卸スキャン
        </h1>
        <div class="text-sm bg-blue-700 px-3 py-1 rounded-full shadow-inner">
            Web App
        </div>
    </header>

    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4 pb-24">
        
        <!-- 現在の選択ステータス -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 font-medium">現在の棚卸エリア</p>
                <p id="currentArea" class="text-lg font-bold text-blue-600">⚠️ 未選択 (Ar_...)</p>
            </div>
            <div id="areaIndicator" class="h-3 w-3 rounded-full bg-red-500 animate-pulse"></div>
        </div>

        <!-- スキャナーセクション -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1">
                📷 バーコードリーダー
            </h2>
            <div id="reader" class="overflow-hidden rounded-lg bg-black aspect-video w-full border border-gray-300"></div>
            <p class="text-xs text-center text-gray-500">
                エリアバーコード(<span class="font-mono bg-gray-100 px-1 rounded">Ar_</span>) または 品物バーコード(<span class="font-mono bg-gray-100 px-1 rounded">ITEM_</span>) をかざしてください
            </p>
        </div>

        <!-- データ履歴セクション -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1">
                    📊 スキャンデータ履歴 (<span id="dataCount">0</span>件)
                </h2>
                <button id="downloadCsv" class="text-xs text-blue-600 font-bold hover:underline hidden">
                    CSV出力
                </button>
            </div>
            
            <div id="historyList" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                <!-- 履歴が空の時の表示 -->
                <p id="emptyMessage" class="text-center text-gray-400 py-8 text-sm">
                    データがありません。バーコードをスキャンしてください。
                </p>
            </div>
        </div>

    </main>

    <!-- 個数入力ダイアログ (モーダル) -->
    <div id="quantityModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden animate-fade-in">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-xl space-y-4">
            <div class="text-center space-y-1">
                <p class="text-xs font-bold text-green-600 tracking-wider uppercase">品物を検知しました</p>
                <h3 id="modalItemTitle" class="text-lg font-black text-gray-900 truncate">ITEM_001</h3>
            </div>
            
            <div>
                <label for="quantityInput" class="block text-xs font-medium text-gray-500 mb-1">数量を入力してください</label>
                <input type="number" id="quantityInput" min="1" value="1" 
                       class="w-full text-center text-2xl font-bold p-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none bg-gray-50">
            </div>

            <div class="flex gap-2 pt-2">
                <button id="cancelModalBtn" class="flex-1 py-3 text-sm font-bold text-gray-500 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors">
                    キャンセル
                </button>
                <button id="submitModalBtn" class="flex-1 py-3 text-sm font-bold text-white bg-blue-600 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-200 transition-colors">
                    確定して再開
                </button>
            </div>
        </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-3 rounded-full shadow-lg z-50 font-medium transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2">
        トーストメッセージ
    </div>

    <script>
        // --- 状態管理 ---
        let currentAreaId = localStorage.getItem('inventory_current_area') || '';
        let inventoryData = JSON.parse(localStorage.getItem('inventory_records')) || [];
        let html5QrcodeScanner = null;
        let isProcessing = false; // 重複読み込み防止フラグ
        let pendingItemId = '';   // 数量入力待ちの品物ID

        // --- DOM要素 ---
        const currentAreaEl = document.getElementById('currentArea');
        const areaIndicatorEl = document.getElementById('areaIndicator');
        const quantityModalEl = document.getElementById('quantityModal');
        const modalItemTitleEl = document.getElementById('modalItemTitle');
        const quantityInputEl = document.getElementById('quantityInput');
        const submitModalBtn = document.getElementById('submitModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const historyListEl = document.getElementById('historyList');
        const emptyMessageEl = document.getElementById('emptyMessage');
        const dataCountEl = document.getElementById('dataCount');
        const downloadCsvBtn = document.getElementById('downloadCsv');
        const toastEl = document.getElementById('toast');

        // --- 初期化処理 ---
        window.addEventListener('DOMContentLoaded', () => {
            updateAreaUI();
            renderHistory();
            initScanner();
            
            // イベントリスナー登録
            submitModalBtn.addEventListener('click', submitQuantity);
            cancelModalBtn.addEventListener('click', closeModal);
            downloadCsvBtn.addEventListener('click', exportToCsv);
            
            // Enterキーで確定できるように
            quantityInputEl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitQuantity();
            });
        });

        // --- トースト通知 ---
        function showToast(message, duration = 2500) {
            toastEl.innerText = message;
            toastEl.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            toastEl.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
            }, duration);
        }

        // --- エリアUI更新 ---
        function updateAreaUI() {
            if (currentAreaId) {
                currentAreaEl.innerText = currentAreaId;
                currentAreaEl.classList.remove('text-red-500');
                currentAreaEl.classList.add('text-blue-600');
                areaIndicatorEl.classList.remove('bg-red-500');
                areaIndicatorEl.classList.add('bg-green-500');
            } else {
                currentAreaEl.innerText = '⚠️ 未選択 (Ar_...)';
                currentAreaEl.classList.remove('text-blue-600');
                currentAreaEl.classList.add('text-red-500');
                areaIndicatorEl.classList.remove('bg-green-500');
                areaIndicatorEl.classList.add('bg-red-500');
            }
        }

        // --- スキャナー初期化 ---
        function initScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { 
                fps: 10, 
                qrbox: function(width, height) {
                    // スマホの画面幅に合わせて読み取りボックスのサイズを動的に調整
                    const size = Math.min(width, height) * 0.7;
                    return { width: size, height: size * 0.5 }; // バーコード用に横長にする
                },
                rememberLastUsedCamera: true
            };

            html5QrcodeScanner.start(
                { facingMode: "environment" }, // 背面カメラ優先
                config,
                onScanSuccess
            ).catch(err => {
                console.error("カメラ起動エラー:", err);
                historyListEl.innerHTML = `<p class="text-center text-red-500 py-4 text-xs">カメラの起動に失敗しました。カメラのアクセス権限を確認してください。</p>`;
            });
        }

        // --- スキャン成功時の処理 ---
        function onScanSuccess(decodedText) {
            if (isProcessing) return; // ダイアログ表示中などは無視

            if (decodedText.startsWith('Ar_')) {
                // エリアIDの処理
                isProcessing = true;
                currentAreaId = decodedText;
                localStorage.setItem('inventory_current_area', currentAreaId);
                updateAreaUI();
                showToast(`エリアを「${decodedText}」に変更しました`);
                
                // 少し待ってから次のスキャンを許可
                setTimeout(() => { isProcessing = false; }, 1500);

            } else if (decodedText.startsWith('ITEM_')) {
                // 品物IDの処理
                if (!currentAreaId) {
                    showToast('⚠️ 最初にエリアバーコード(Ar_...)をスキャンしてください');
                    return;
                }
                
                isProcessing = true;
                pendingItemId = decodedText;
                
                // モーダル表示
                modalItemTitleEl.innerText = decodedText;
                quantityInputEl.value = 1;
                quantityModalEl.classList.remove('hidden');
                
                // 入力欄にオートフォーカス (モバイル端末によってはキーボードが出ない場合もあります)
                setTimeout(() => {
                    quantityInputEl.focus();
                    quantityInputEl.select();
                }, 100);

            } else {
                // 対象外のバーコードはスルー (UIを出さない)
                console.log("対象外のコード:", decodedText);
            }
        }

        // --- 個数確定処理 ---
        function submitQuantity() {
            const qty = parseInt(quantityInputEl.value, 10);
            if (isNaN(qty) || qty <= 0) {
                alert('1以上の正しい個数を入力してください');
                return;
            }

            // データオブジェクト作成
            const record = {
                id: Date.now().toString(), // 削除用のユニークキー
                datetime: new Date().toLocaleString('ja-JP'),
                area: currentAreaId,
                item: pendingItemId,
                quantity: qty
            };

            // データの保存
            inventoryData.unshift(record); // 先頭に追加して新しい順にする
            localStorage.setItem('inventory_records', JSON.stringify(inventoryData));
            
            showToast(`💾 ${pendingItemId} を ${qty} 個 記録しました`);
            
            renderHistory();
            closeModal();
        }

        // --- モーダルを閉じてカメラ再開 ---
        function closeModal() {
            quantityModalEl.classList.add('hidden');
            pendingItemId = '';
            // タイムアウトを設けて、ダイアログを閉じた瞬間の誤スキャンを防止
            setTimeout(() => {
                isProcessing = false;
            }, 1000);
        }

        // --- 履歴の描画 ---
        function renderHistory() {
            dataCountEl.innerText = inventoryData.length;
            
            if (inventoryData.length === 0) {
                emptyMessageEl.classList.remove('hidden');
                downloadCsvBtn.classList.add('hidden');
                // 古いリストアイテムをクリア
                const items = historyListEl.querySelectorAll('.history-item');
                items.forEach(el => el.remove());
                return;
            }

            emptyMessageEl.classList.add('hidden');
            downloadCsvBtn.classList.remove('hidden');

            // 既存のリスト要素を一度削除して再描画
            const items = historyListEl.querySelectorAll('.history-item');
            items.forEach(el => el.remove());

            inventoryData.forEach(data => {
                const div = document.createElement('div');
                div.className = 'history-item bg-gray-50 border border-gray-200 rounded-lg p-3 flex justify-between items-center text-xs shadow-xs animate-fade-in';
                div.innerHTML = `
                    <div class="space-y-1 flex-1 min-w-0 pr-2">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-gray-900 truncate max-w-[120px]" title="${data.item}">${data.item}</span>
                            <span class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded text-[10px] font-medium truncate max-w-[80px]">${data.area}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 font-mono">${data.datetime}</div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <span class="text-base font-black text-gray-900">${data.quantity}</span> <span class="text-gray-500 font-medium">個</span>
                        </div>
                        <button onclick="deleteRecord('${data.id}')" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors" title="削除">
                            🗑️
                        </button>
                    </div>
                `;
                historyListEl.appendChild(div);
            });
        }

        // --- レコード削除 ---
        window.deleteRecord = function(id) {
            if (confirm('このレコードを削除してもよろしいですか？')) {
                inventoryData = inventoryData.filter(item => item.id !== id);
                localStorage.setItem('inventory_records', JSON.stringify(inventoryData));
                showToast('データを削除しました');
                renderHistory();
            }
        };

        // --- CSVエクスポート機能 ---
        function exportToCsv() {
            if (inventoryData.length === 0) return;

            // BOM付き UTF-8 でExcelの文字化けを防止
            let csvContent = "﻿日時,エリアID,品物ID,個数
";
            
            inventoryData.forEach(row => {
                // 安全のためにダブルクォーテーションで囲む
                csvContent += `"${row.datetime}","${row.area}","${row.item}",${row.quantity}
`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            
            const dateStr = new Date().toISOString().slice(0,10);
            link.setAttribute("href", url);
            link.setAttribute("download", `棚卸データ_${dateStr}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
